# GoReleaser v2 configuration: static binaries (no cgo) for linux and darwin.
version: 2
project_name: term-achievements
builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
