# GoReleaser v2 configuration: static binaries (no cgo) for linux and darwin.
version: 2
project_name: term-achievements
builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt

# Homebrew formula, pushed to dpologdvinity/homebrew-tap on every tagged release.
# (`brews` is used rather than `homebrew_casks` because casks are macOS-only and the
# formula also serves Linuxbrew.) The token is a fine-grained PAT stored as the
# repository secret HOMEBREW_TAP_TOKEN; the built-in GITHUB_TOKEN cannot push to another repo.
brews:
  - name: term-achievements
    repository:
      owner: dpologdvinity
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dpologdvinity/term-achievements
    description: Xbox-style achievements for your shell
    license: MIT
    test: |
      assert_match "term-achievements", shell_output("#{bin}/term-achievements --version")

# Linux packages attached to each GitHub release: install with
# `sudo apt install ./term-achievements_<version>_linux_<arch>.deb` (or dnf/rpm for .rpm).
nfpms:
  - id: packages
    package_name: term-achievements
    vendor: Kaitlyn Bassford
    maintainer: Kaitlyn Bassford <dpologdvinity@users.noreply.github.com>
    homepage: https://github.com/dpologdvinity/term-achievements
    description: Xbox-style achievements for your shell
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/term-achievements/LICENSE
      - src: README.md
        dst: /usr/share/doc/term-achievements/README.md
