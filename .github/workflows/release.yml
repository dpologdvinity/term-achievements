# Publishes a GitHub release with archives for linux/darwin (amd64, arm64) when a tag
# like v0.1.0 is pushed. Settings live in .goreleaser.yaml.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Never publish a tag that does not pass the full test suite.
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Run tests with race detector
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on dpologdvinity/homebrew-tap (formula push).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Adds this release's .deb files to the signed apt repository on GitHub Pages.
  apt-repo:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/apt-repo.yml
    with:
      tags: ${{ github.ref_name }}
    secrets: inherit
